name: CI

on:
  push:
    branches: [main]
  pull_request:

# a newer push supersedes a running check of the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FPBENCH: ~/fpbench

jobs:
  # Verify the project builds and installs cleanly under each supported
  # Python version.  ``uv`` is our primary workflow; the ``pip`` variant
  # keeps the legacy ``pip install -e .[dev]`` entry point from regressing.
  build-uv:
    name: "Build (uv)"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Build package
        run: uv build
      - name: Install fpy2
        run: uv sync --locked

  build-pip:
    name: "Build (pip)"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip build
      - name: Build package
        run: python -m build
      - name: Install fpy2
        run: pip install -e .[dev]

  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check fpy2/
      - name: Mypy
        run: uv run mypy fpy2

  unit:
    name: "Unit tests (${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: "Checkout fpbench/fpbench"
        uses: actions/checkout@v7
        with:
          repository: fpbench/fpbench
          path: ~/fpbench
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked
      - name: Unit tests
        run: uv run make unittest UNITTEST_JOBS=auto
      - name: Infrastructure tests
        run: uv run python -m tests.infra

  # macOS is arm64, where the C++ backend's float-to-integer conversions differ
  # from x86-64's -- the `unit` job above cannot see that difference.  Unit
  # tests only: the infrastructure tests need the FPBench corpus.
  unit-macos:
    name: "Unit tests (macOS)"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Unit tests
        run: uv run make unittest UNITTEST_JOBS=auto

  # fpcore:
  #   name: "FPCore tests"
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - name: "Checkout fpbench/fpbench"
  #       uses: actions/checkout@v7
  #       with:
  #         repository: fpbench/fpbench
  #         path: ~/fpbench
  #     - uses: astral-sh/setup-uv@v10
  #       with:
  #         enable-cache: true
  #         python-version: "3.12"
  #     - name: Install
  #       run: uv sync --locked
  #     - name: Compilation tests
  #       run: uv run python -m tests.infra.fpcore

  cpp:
    name: "C++ tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "Checkout fpbench/fpbench"
        uses: actions/checkout@v7
        with:
          repository: fpbench/fpbench
          path: ~/fpbench
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: C++ tests
        # `run` mode is a superset of `compile`: it compiles every corpus
        # function and additionally executes the bit-exact-eligible subset,
        # checking each output against the FPy interpreter.
        run: uv run python -m tests.infra.backend.cpp --mode run

  mmasim:
    name: "MMA-Sim tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Models
        working-directory: examples/mmasim
        run: uv run pytest tests
      - name: Compilation
        # every design to C++ (compiled) and to a Triton kernel (emitted only)
        run: uv run python -m tests.infra.backend.mmasim

  sweep:
    name: "Sweep"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "Checkout fpbench/fpbench"
        uses: actions/checkout@v7
        with:
          repository: fpbench/fpbench
          path: ~/fpbench
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Install local dependencies
        run: uv pip install -r exploration/fused_dp/requirements.txt
      - name: Sweep (fused_dp)
        run: uv run python -m exploration.fused_dp.sweep --threads 2 1_000
